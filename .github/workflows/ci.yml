name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same ref makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep the Gradle daemon out of CI and give Kotlin room on a 7 GB runner.
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  build:
    name: Build, unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image ships an Android SDK, but not necessarily the exact
      # platform and build-tools this project compiles against.
      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        id: lint
        run: ./gradlew :app:lintDebug --stacktrace

      # AGP's abortOnError already fails the build on a lint error, and
      # app/build.gradle.kts sets it explicitly. This reads the report anyway
      # so a surviving error is annotated on the PR rather than buried in the
      # Gradle log, and so a missing report is itself a failure.
      - name: Check the lint report
        # Runs whether lint passed or failed, so an error is annotated either
        # way -- but not when an earlier step failed and lint never ran, where
        # a missing report says nothing and would bury the real cause. A
        # wrapper download that 504s used to surface here as "lint report not
        # found", which is worse than silence.
        if: ${{ !cancelled() && contains(fromJSON('["success", "failure"]'), steps.lint.outcome) }}
        run: |
          python3 - <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET

          report = pathlib.Path("app/build/reports/lint-results-debug.xml")
          if not report.is_file():
              print(f"::error::lint report not found at {report}")
              sys.exit(1)

          issues = ET.parse(report).getroot().findall("issue")
          errors = [i for i in issues if i.get("severity") == "Error"]
          warnings = [i for i in issues if i.get("severity") == "Warning"]
          print(f"lint: {len(errors)} error(s), {len(warnings)} warning(s)")

          for issue in errors:
              location = issue.find("location")
              where = location.get("file", "") if location is not None else ""
              line = location.get("line", "") if location is not None else ""
              prefix = f"file={where},line={line}::" if where else "::"
              print(f"::error {prefix}{issue.get('id')}: {issue.get('message')}")

          sys.exit(1 if errors else 0)
          PY

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn

  dataset:
    name: Dataset validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/guide_pipeline/requirements.txt

      # Validates UTF-8, the pydantic schema, id uniqueness and format, foreign
      # keys, and the recorded coverage. It exits non-zero on a count shortfall
      # that the dataset does not declare as a gap, so the data cannot become
      # quietly incomplete.
      - name: Validate the shipped dataset
        run: python3 scripts/guide_pipeline/validate_json.py

      # The Kotlin models are generated from schema.py. If someone edits the
      # schema without regenerating, the app and the data file drift apart --
      # which has already caused one decode failure. Regenerate and diff.
      - name: Check the generated Kotlin models are up to date
        run: |
          python3 scripts/guide_pipeline/gen_kotlin.py
          if ! git diff --exit-code --stat -- \
            app/src/main/java/com/madmaxlgndklr/resonanceguide/data/model/GuideModels.kt; then
            echo "::error::GuideModels.kt is out of date. Run python3 scripts/guide_pipeline/gen_kotlin.py and commit the result."
            git diff -- app/src/main/java/com/madmaxlgndklr/resonanceguide/data/model/GuideModels.kt
            exit 1
          fi

      # The source registry is the pipeline's record of what each site permits.
      # Importing it catches a syntax error or a malformed entry; it performs no
      # network access without --recheck, and CI never crawls.
      - name: Print the source permission registry
        run: python3 scripts/guide_pipeline/sources.py

  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    # These cover the Room 1 -> 2 migration and that progress survives a
    # reseed. They need a device, so this job is the only place they run.
    # Emulator boots are occasionally flaky; re-run the job rather than
    # assuming a failure is real, but do not merge on an unexplained red.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # KVM is what makes an x86_64 emulator usable on a hosted runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

      # The Gradle log reports only that the task failed. Print the per-test
      # failure messages so a red run is diagnosable from the log alone,
      # without downloading the artifact.
      - name: Show instrumented test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET

          results = sorted(
              pathlib.Path("app/build/outputs/androidTest-results").rglob("*.xml")
          )
          if not results:
              print("no androidTest result XML found")
          for path in results:
              for case in ET.parse(path).getroot().iter("testcase"):
                  for outcome in list(case.iter("failure")) + list(case.iter("error")):
                      name = f"{case.get('classname')}.{case.get('name')}"
                      print(f"::group::{name}")
                      print(outcome.get("message") or "")
                      print((outcome.text or "").strip()[:4000])
                      print("::endgroup::")
                      print(f"::error::{name}: {outcome.get('message')}")
          PY

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
